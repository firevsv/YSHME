<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; line-height: 1.6; }
  h1 { margin-bottom: 4px; }
  .subtitle { color: #666; margin-top: 0; }
  .gallery { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 24px; }
  .gallery img { max-width: 100%; width: 300px; border-radius: 8px; }
</style>
</head>
<body>
  <h1>{{title}}</h1>
  <p class="subtitle">{{subtitle}}</p>
  <div class="body">{{body}}</div>
  <div class="gallery">{{gallery}}</div>
</body>
</html>
